<!doctype html>
<html><head><meta charset="utf-8"><title>BedAlert phase update cover</title>
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(fonts/space-grotesk-latin-700-normal.woff2); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url(fonts/inter-latin-600-normal.woff2); }
  @font-face { font-family: "Plex Mono"; font-weight: 700; src: url(fonts/ibm-plex-mono-latin-700-normal.woff2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; color: #F4F7FA; font-family: Inter;
    background: radial-gradient(1100px 800px at 60% 25%, #0F6E6E 0%, #0B2545 55%, #071a33 100%); }
  .tag { position: absolute; left: 70px; top: 200px; font-family: "Plex Mono"; font-weight: 700; font-size: 34px; letter-spacing: .12em; color: #8FE3C6; }
  h1 { position: absolute; left: 70px; right: 150px; top: 260px; font-family: "Space Grotesk"; font-size: 130px; line-height: .98; letter-spacing: -.02em; }
  .steps { position: absolute; left: 70px; right: 150px; top: 620px; display: grid; gap: 26px; }
  .s { border-radius: 30px; padding: 30px 36px; background: rgba(255,255,255,.07); border: 3px solid rgba(255,255,255,.15); }
  .s .k { font-family: "Plex Mono"; font-weight: 700; font-size: 28px; letter-spacing: .1em; color: #9FB3C8; }
  .s .t { font-family: "Space Grotesk"; font-weight: 700; font-size: 64px; margin-top: 6px; }
  .s.done { border-color: #8FE3C6; } .s.done .k { color: #8FE3C6; }
  .s.next { background: #8FE3C6; color: #0B2545; border-color: #8FE3C6; } .s.next .k { color: #0B2545; }
  .team { position: absolute; left: 70px; top: 1180px; display: flex; gap: 22px; align-items: center; }
  .av { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-family: "Space Grotesk"; font-weight: 700; font-size: 50px; color: #0B2545; }
  .team .l { font-size: 34px; line-height: 1.3; margin-left: 10px; }
  .brand { position: absolute; left: 70px; top: 1390px; display: flex; align-items: center; gap: 18px; font-family: "Space Grotesk"; font-weight: 700; font-size: 56px; }
  .brand i { width: 34px; height: 34px; border-radius: 50%; background: #8FE3C6; box-shadow: 0 0 0 10px rgba(143,227,198,.2); }
</style></head>
<body>
  <div class="tag">BEDALERT · BUILD UPDATE 🇬🇭</div>
  <h1>Where we are.<br>What’s next.</h1>
  <div class="steps">
    <div class="s done"><div class="k">PHASE 1 · DONE ✓</div><div class="t">Core system built</div></div>
    <div class="s next"><div class="k">PHASE 2 · NOW</div><div class="t">3 apps → pilot</div></div>
  </div>
  <div class="team">
    <div class="av" style="background:#8FE3C6">R</div><div class="av" style="background:#E8A33D">J</div><div class="av" style="background:#F4F7FA">W</div>
    <div class="l">Built by students<br>at KNUST &amp; UG</div>
  </div>
  <div class="brand"><i></i>BedAlert</div>
</body></html>
